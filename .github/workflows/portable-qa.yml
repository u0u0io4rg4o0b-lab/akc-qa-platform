name: Portable QA validation

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Validate all platforms, or only the affected Linux environment
        type: choice
        default: all
        options:
          - all
          - linux

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(inputs.platform == 'linux' && '{"include":[{"os":"ubuntu-latest","python":"3.11.18"}]}' || '{"include":[{"os":"windows-latest","python":"3.11.9"},{"os":"ubuntu-latest","python":"3.11.18"},{"os":"macos-latest","python":"3.14"}]}') }}
    env:
      PYTHONIOENCODING: utf-8
      AKC_QA_TEST_TIMEOUT_SCALE: '2'
    steps:
      - name: Read exact source and predecessor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select test runtime
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test synthetic subjects and predecessor compatibility
        run: python -B tools/validate_release.py
